<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#0f172a" />
  <!-- Silueta dinámica de atleta saltando con brazos arriba -->
  <circle cx="100" cy="52" r="10" fill="#38bdf8" />
  <path d="M100 64 L100 115" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Brazos extendidos hacia el techo -->
  <path d="M96 75 L80 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M104 75 L120 40" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <!-- Piernas en el aire saltando -->
  <path d="M96 115 L86 148 L84 162" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M104 115 L114 148 L116 162" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Flechas o líneas de energía de salto -->
  <path d="M60 145 L70 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M140 145 L130 135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <!-- Suelo debajo con espacio para denotar salto -->
  <line x1="40" y1="175" x2="160" y2="175" stroke="#334155" stroke-width="4" stroke-linecap="round" />
</svg>
