<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#0f172a" />
  <!-- Banco detrás -->
  <rect x="40" y="112" width="30" height="36" rx="4" fill="#334155" />
  <!-- Cabeza y espalda apoyada en banco -->
  <circle cx="56" cy="98" r="9" fill="#38bdf8" />
  <!-- Torso elevado en línea recta con muslos (extensión de cadera) -->
  <path d="M68 114 L110 114" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Piernas flexionadas 90° con pies en el suelo -->
  <path d="M110 114 L138 114 L142 164" stroke="#38bdf8" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Barra sobre la pelvis / cadera -->
  <rect x="88" y="102" width="44" height="6" rx="2" fill="#cbd5e1" />
  <circle cx="90" cy="105" r="14" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
  <circle cx="130" cy="105" r="14" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
  <!-- Suelo -->
  <line x1="25" y1="166" x2="175" y2="166" stroke="#334155" stroke-width="4" stroke-linecap="round" />
</svg>
