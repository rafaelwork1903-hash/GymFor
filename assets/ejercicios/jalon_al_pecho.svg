<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#0f172a" />
  <!-- Estructura polea superior -->
  <line x1="100" y1="25" x2="100" y2="48" stroke="#475569" stroke-width="4" />
  <!-- Barra de jalón ancha -->
  <path d="M50 56 L100 50 L150 56" stroke="#cbd5e1" stroke-width="5" fill="none" stroke-linecap="round" />
  <!-- Cabeza y torso sentado -->
  <circle cx="100" cy="88" r="10" fill="#38bdf8" />
  <path d="M100 100 L100 138" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Asiento de la máquina -->
  <rect x="80" y="140" width="40" height="8" rx="2" fill="#334155" />
  <rect x="96" y="148" width="8" height="24" rx="2" fill="#475569" />
  <!-- Brazos flexionados traccionando la barra hacia el pecho -->
  <path d="M94 102 L68 76 L56 56" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M106 102 L132 76 L144 56" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Muslos bajo los rodillos -->
  <rect x="85" y="130" width="30" height="8" rx="4" fill="#64748b" />
  <path d="M100 138 L116 142 L120 170" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
