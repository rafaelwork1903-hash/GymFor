<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#0f172a" />
  <!-- Cabeza mirando hacia abajo -->
  <circle cx="150" cy="108" r="9" fill="#38bdf8" />
  <!-- Torso recto y alineado -->
  <path d="M142 113 L60 128" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Antebrazo apoyado en suelo -->
  <path d="M136 117 L136 148 L155 148" stroke="#38bdf8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Puntas de los pies en el suelo -->
  <circle cx="56" cy="132" r="5" fill="#64748b" />
  <line x1="56" y1="134" x2="56" y2="150" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <!-- Línea del suelo -->
  <line x1="30" y1="152" x2="175" y2="152" stroke="#334155" stroke-width="4" stroke-linecap="round" />
</svg>
