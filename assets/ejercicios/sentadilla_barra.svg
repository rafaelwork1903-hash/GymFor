<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="16" fill="#0f172a" />
  <!-- Cabeza -->
  <circle cx="95" cy="52" r="10" fill="#38bdf8" />
  <!-- Barra sobre hombros -->
  <rect x="50" y="65" width="100" height="6" rx="3" fill="#cbd5e1" />
  <rect x="42" y="55" width="8" height="26" rx="3" fill="#e2e8f0" />
  <rect x="150" y="55" width="8" height="26" rx="3" fill="#e2e8f0" />
  <!-- Torso inclinado ligeramente -->
  <path d="M96 64 L90 106" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
  <!-- Brazos sosteniendo la barra -->
  <path d="M92 68 L80 66 L78 72" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M98 68 L114 66 L118 72" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Muslos y rodillas en sentadilla profunda / paralela -->
  <path d="M90 106 L62 115 L68 158" stroke="#0284c7" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M90 106 L78 120 L84 158" stroke="#38bdf8" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pies / Suelo -->
  <line x1="30" y1="165" x2="170" y2="165" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <path d="M64 158 L56 163" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <path d="M80 158 L74 163" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
</svg>
